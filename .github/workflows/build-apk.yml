name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - run: flutter pub get

      # Sign with the real upload key when the secrets are set; otherwise fall
      # back to a throwaway key so the build still produces installable APKs.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/upload-keystore.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            ALIAS="${KEY_ALIAS:-upload}"
            STORE_PW="$KEYSTORE_PASSWORD"
            KEY_PW="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::KEYSTORE_BASE64 not set; signing with a throwaway key (not for Play Store)."
            ALIAS=upload; STORE_PW=temppass; KEY_PW=temppass
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PW" -keypass "$KEY_PW" -dname "CN=Outgrow CI"
          fi
          {
            echo "storeFile=$KS"
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$ALIAS"
          } >> android/local.properties

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: outgrow-apks
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
